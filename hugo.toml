title = "Leonardo Benicio"
theme = "github.com/lbenicio/theme"
baseURL = "https://blog.lbenicio.dev/"
version = "2.1.11"
locale = "en-us"
resourceDir = "resources"

[pagination]
pagerSize = 24
path = "page"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "github-dark"
guessSyntax = true

[taxonomies]
tag = "tags"
category = "categories"

[outputFormats.markdown]
mediaType = "text/markdown"
isPlainText = true
permalinkable = true

[outputs]
home = ["HTML", "RSS", "markdown"]
page = ["HTML", "markdown"]
section = ["HTML", "RSS", "JSON", "markdown"]
taxonomy = ["HTML", "RSS", "markdown"]
term = ["HTML", "RSS", "markdown"]
404 = ["HTML", "markdown"]

[sitemap]
changefreq = "daily"
priority = 0.5
filename = "sitemap.xml"

[permalinks]
post = "/post/:year/:month/:day/:slug/"

[params]
author = "Leonardo Benicio"
description = "Posts, notes, and articles."
showReadingTime = true

# Social handlers (global defaults; overridable per-page via front matter)
githubHandler = "lbenicio"
linkedinHandler = "leonardo-benicio"
twitterHandler = "lbenicio_"

# Production site URLs
siteUrl = "https://blog.lbenicio.dev/"
appMode = "BLOG_ONLY"
aboutOrigin = "https://lbenicio.dev/"
blogOrigin = "https://blog.lbenicio.dev/"

# Fork me ribbon
enableForkMe = true
forkMeRepoUrl = "https://github.com/lbenicio/blog"

# Legal links
privacyUrl = "https://legal.lbenicio.dev/docs/privacy-policy"
termsUrl = "https://legal.lbenicio.dev/docs/terms-of-service"

[services.googleAnalytics]
id = "G-ZY05FZN4N5"

[privacy.googleAnalytics]
respectDoNotTrack = true
