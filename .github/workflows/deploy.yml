name: Deploy to Cloudflare Workers

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: cloudflare-deploy
    cancel-in-progress: true

env:
    SITE_URL: https://blog.lbenicio.dev/
    ABOUT_URL: https://lbenicio.dev/
    PUBLICATIONS_URL: https://lbenicio.dev/publications/

jobs:
    deps:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.163.1"
                  extended: true

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.27.x"
                  cache: false

            - name: Cache Go modules
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: go-${{ runner.os }}-

            - name: Cache Hugo modules
              uses: actions/cache@v6
              with:
                  path: /tmp/hugo_cache
                  key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: hugo-${{ runner.os }}-

            - name: Download Go dependencies
              run: go mod download

            - name: Download Hugo modules
              run: hugo mod get

    build:
        needs: deps
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.163.1"
                  extended: true

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.27.x"
                  cache: false

            - name: Restore Go cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: go-${{ runner.os }}-

            - name: Restore Hugo cache
              uses: actions/cache@v6
              with:
                  path: /tmp/hugo_cache
                  key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: hugo-${{ runner.os }}-

            - name: Install Dart Sass
              env:
                  DART_SASS_VERSION: 1.108.0
                  DART_SASS_SHA256: e608a6a633af36ab518919b502581d891d50a05e3adf5bd541e977ab6a4a92a1
              run: |
                  curl --fail --silent --show-error --location \
                    "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
                    --output "${RUNNER_TEMP}/dart-sass.tar.gz"
                  echo "${DART_SASS_SHA256}  ${RUNNER_TEMP}/dart-sass.tar.gz" | sha256sum -c -
                  tar -xzf "${RUNNER_TEMP}/dart-sass.tar.gz" -C "${RUNNER_TEMP}"
                  echo "${RUNNER_TEMP}/dart-sass" >> "$GITHUB_PATH"
                  "${RUNNER_TEMP}/dart-sass/sass" --version

            - name: Generate OG images
              run: go run github.com/lbenicio/theme/cmd/ogimage@v0.6.0 --glob="content/post/*.md" --out="static/static/og"
              continue-on-error: true

            - name: Build with Hugo
              run: |
                  cat > /tmp/hugo-dynamic.toml << EOF
                  baseURL = "${SITE_URL}"
                  [params]
                  siteUrl = "${SITE_URL}"
                  aboutOrigin = "${ABOUT_URL}"
                  blogOrigin = "${SITE_URL}"
                  publicationsOrigin = "${PUBLICATIONS_URL}"
                  EOF

                  echo "::group::Hugo build"
                  echo "  baseURL          = ${SITE_URL}"
                  echo "  siteUrl          = ${SITE_URL}"
                  echo "  aboutOrigin      = ${ABOUT_URL}"
                  echo "  blogOrigin       = ${SITE_URL}"
                  echo "  publicationsOrigin = ${PUBLICATIONS_URL}"
                  hugo --minify --environment production --cleanDestinationDir --config hugo.toml,/tmp/hugo-dynamic.toml --logLevel info
                  echo "::endgroup::"
                  echo "Build complete — $(find public -type f | wc -l) files generated"

            - name: Upload built site artifact
              uses: actions/upload-artifact@v7
              with:
                  name: hugo-built
                  path: ./public
                  retention-days: 1

    obfuscate:
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.27.x"
                  cache: false

            - name: Download built site artifact
              uses: actions/download-artifact@v8
              with:
                  name: hugo-built
                  path: ./public

            - name: Obfuscate
              run: |
                  echo "::group::Obfuscation"
                  echo "Files to process: $(find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) | wc -l)"
                  GOPROXY=direct go run github.com/lbenicio/theme/cmd/obfuscate@v0.6.0 -verbose ./public
                  echo "::endgroup::"

            - name: Upload obfuscated site artifact
              uses: actions/upload-artifact@v7
              with:
                  name: hugo-public
                  path: ./public
                  retention-days: 1

    deploy:
        needs: obfuscate
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: ${{ env.SITE_URL }}
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Download obfuscated site artifact
              uses: actions/download-artifact@v8
              with:
                  name: hugo-public
                  path: ./public

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Deploy to Cloudflare Workers
              env:
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npx --yes wrangler@4 deploy --config wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"

    report:
        needs: [deps, build, obfuscate, deploy]
        if: always()
        runs-on: ubuntu-24.04
        steps:
            - name: Generate summary
              env:
                  DEPENDENCIES: ${{ needs.deps.result }}
                  BUILD: ${{ needs.build.result }}
                  OBFUSCATION: ${{ needs.obfuscate.result }}
                  DEPLOY: ${{ needs.deploy.result }}
                  SITE_URL: ${{ env.SITE_URL }}
              run: |
                  {
                    echo "## 🚀 Cloudflare Workers deployment"
                    echo ""
                    echo "| Job | Result |"
                    echo "|-----|--------|"
                    echo "| Dependencies | $DEPENDENCIES |"
                    echo "| Build | $BUILD |"
                    echo "| Obfuscation | $OBFUSCATION |"
                    echo "| Cloudflare deploy | $DEPLOY |"
                    echo ""
                    echo "**Site:** $SITE_URL"
                  } >> "$GITHUB_STEP_SUMMARY"
