name: Deploy to AWS

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: aws-deploy
    cancel-in-progress: true

env:
    AWS_REGION: sa-east-1
    AWS_STACK_NAME: blog
    SITE_URL: https://blog.lbenicio.dev/
    ABOUT_URL: https://lbenicio.dev/
    PUBLICATIONS_URL: https://lbenicio.dev/publications/

jobs:
    deps:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.163.1"
                  extended: true

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.26"
                  cache: false

            - name: Cache Go modules
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: go-${{ runner.os }}-

            - name: Cache Hugo modules
              uses: actions/cache@v6
              with:
                  path: /tmp/hugo_cache
                  key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: hugo-${{ runner.os }}-

            - name: Download Go dependencies
              run: go mod download

            - name: Download Hugo modules
              run: hugo mod get

    build:
        needs: deps
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.163.1"
                  extended: true

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.26"
                  cache: false

            - name: Restore Go cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: go-${{ runner.os }}-

            - name: Restore Hugo cache
              uses: actions/cache@v6
              with:
                  path: /tmp/hugo_cache
                  key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
                  restore-keys: hugo-${{ runner.os }}-

            - name: Generate OG images
              run: go run github.com/lbenicio/aboutme-v2-theme/cmd/ogimage@latest --glob="content/post/*.md" --out="static/static/og"
              continue-on-error: true

            - name: Build with Hugo
              run: |
                  cat > /tmp/hugo-dynamic.toml << EOF
                  baseURL = "${SITE_URL}"
                  [params]
                  siteUrl = "${SITE_URL}"
                  aboutOrigin = "${ABOUT_URL}"
                  blogOrigin = "${SITE_URL}"
                  publicationsOrigin = "${PUBLICATIONS_URL}"
                  EOF

                  echo "::group::Hugo build"
                  echo "  baseURL          = ${SITE_URL}"
                  echo "  siteUrl          = ${SITE_URL}"
                  echo "  aboutOrigin      = ${ABOUT_URL}"
                  echo "  blogOrigin       = ${SITE_URL}"
                  echo "  publicationsOrigin = ${PUBLICATIONS_URL}"
                  hugo --minify --environment production --cleanDestinationDir --config hugo.toml,/tmp/hugo-dynamic.toml --logLevel info
                  echo "::endgroup::"
                  echo "Build complete — $(find public -type f | wc -l) files generated"

            - name: Upload built site artifact
              uses: actions/upload-artifact@v7
              with:
                  name: hugo-built
                  path: ./public
                  retention-days: 1

    obfuscate:
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.26"
                  cache: false

            - name: Download built site artifact
              uses: actions/download-artifact@v8
              with:
                  name: hugo-built
                  path: ./public

            - name: Obfuscate
              run: |
                  echo "::group::Obfuscation"
                  echo "Files to process: $(find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) | wc -l)"
                  GOPROXY=direct go run github.com/lbenicio/aboutme-v2-theme/cmd/obfuscate@main -verbose ./public
                  echo "::endgroup::"

            - name: Upload obfuscated site artifact
              uses: actions/upload-artifact@v7
              with:
                  name: hugo-public
                  path: ./public
                  retention-days: 1

    deploy:
        needs: obfuscate
        runs-on: ubuntu-24.04
        steps:
            - name: Download obfuscated site artifact
              uses: actions/download-artifact@v8
              with:
                  name: hugo-public
                  path: ./public

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Resolve CloudFormation outputs
              id: stack
              run: |
                  set -euo pipefail

                  outputs="$(aws cloudformation describe-stacks \
                    --stack-name "${AWS_STACK_NAME}" \
                    --query 'Stacks[0].Outputs' \
                    --output json)"
                  bucket="$(jq -r '.[] | select(.OutputKey == "S3BucketName") | .OutputValue' <<< "${outputs}")"
                  distribution_id="$(jq -r '.[] | select(.OutputKey == "CloudFrontDistributionId") | .OutputValue' <<< "${outputs}")"

                  if [ -z "${bucket}" ] || [ "${bucket}" = "None" ]; then
                    echo "CloudFormation stack ${AWS_STACK_NAME} has no S3BucketName output." >&2
                    exit 1
                  fi
                  if [ -z "${distribution_id}" ] || [ "${distribution_id}" = "None" ]; then
                    echo "CloudFormation stack ${AWS_STACK_NAME} has no CloudFrontDistributionId output." >&2
                    exit 1
                  fi

                  printf 'bucket=%s\n' "${bucket}" >> "$GITHUB_OUTPUT"
                  printf 'distribution_id=%s\n' "${distribution_id}" >> "$GITHUB_OUTPUT"

            - name: Sync site to S3
              env:
                  S3_BUCKET: ${{ steps.stack.outputs.bucket }}
              run: aws s3 sync ./public/ "s3://${S3_BUCKET}/" --delete

            - name: Invalidate CloudFront
              env:
                  CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
              run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

    report:
        needs: [deps, build, obfuscate, deploy]
        if: always()
        runs-on: ubuntu-24.04
        steps:
            - name: Generate summary
              run: |
                  {
                    echo "## 🚀 Deploy to AWS"
                    echo ""
                    echo "| Job | Result |"
                    echo "|-----|--------|"
                    echo "| Dependencies | ${{ needs.deps.result }} |"
                    echo "| Build | ${{ needs.build.result }} |"
                    echo "| Obfuscation | ${{ needs.obfuscate.result }} |"
                    echo "| AWS deploy | ${{ needs.deploy.result }} |"
                    echo ""
                    echo "**Site:** ${SITE_URL}"
                    echo "**Stack:** ${AWS_STACK_NAME}"
                    echo "**Commit:** ${{ github.sha }}"
                  } >> "$GITHUB_STEP_SUMMARY"
