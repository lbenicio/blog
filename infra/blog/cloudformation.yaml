AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates S3 bucket + CloudFront CDN with security headers, OAC,
  and an ACM certificate. Does NOT build or upload site files.
  Run deploy.sh after stack creation.
  DNS in Cloudflare; add validation CNAMEs and site CNAME there.

Parameters:
  DomainName:
    Type: String
    Description: Primary domain (e.g., blog.lbenicio.dev).
    Default: blog.lbenicio.dev

  AlternativeDomains:
    Type: String
    Description: Semicolon-separated additional domains (e.g., "www.blog.lbenicio.dev").
    Default: ""

  CertificateArn:
    Type: String
    Description: ARN of an existing ACM certificate in us-east-1 covering this domain.
    Default: ""

  PriceClass:
    Type: String
    AllowedValues: [PriceClass_All, PriceClass_200, PriceClass_100]
    Default: PriceClass_100

  DefaultRootObject:
    Type: String
    Default: index.html

Conditions:
  HasAlternativeDomains: !Not [!Equals [!Ref AlternativeDomains, ""]]
  CreateCertificate: !Equals [!Ref CertificateArn, ""]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: app, Value: lbenicio-community }
        - Key: awsApplication
          Value: arn:aws:resource-groups:sa-east-1:527540700211:group/lbenicio-community/06owkw4s6gp5r894wctvv2jj5u
        - Key: Project
          Value: blog
        - Key: ManagedBy
          Value: cloudformation

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: blog-oac
        Description: OAC for blog ? only CloudFront can read
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Join ["", [!GetAtt SiteBucket.Arn, "/*"]]
            Condition:
              StringEquals:
                "aws:SourceArn": !Join
                  - ""
                  - - "arn:aws:cloudfront::"
                    - !Ref AWS::AccountId
                    - ":distribution/"
                    - !Ref CloudFrontDistribution
          - Sid: DenyNonSecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Join ["", [!GetAtt SiteBucket.Arn, "/*"]]
              - !GetAtt SiteBucket.Arn
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: blog-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": repo:lbenicio/blog:environment:production
      Policies:
        - PolicyName: DeployBlogSite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBlogStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Sid: ListBlogBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: SyncBlogObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub ${SiteBucket.Arn}/*
              - Sid: InvalidateBlogDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
      Tags:
        - Key: awsApplication
          Value: arn:aws:resource-groups:sa-east-1:527540700211:group/lbenicio-community/06owkw4s6gp5r894wctvv2jj5u
        - Key: Project
          Value: blog

  SiteCertificate:
    Condition: CreateCertificate
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      SubjectAlternativeNames: !If
        - HasAlternativeDomains
        - !Split [";", !Ref AlternativeDomains]
        - !Ref AWS::NoValue
      Tags:
        - { Key: app, Value: lbenicio-community }
        - Key: awsApplication
          Value: arn:aws:resource-groups:sa-east-1:527540700211:group/lbenicio-community/06owkw4s6gp5r894wctvv2jj5u
        - Key: Project
          Value: blog

  # ?? CloudFront Function: resolve /dir/ ? /dir/index.html ???????????
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: blog-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html to directory requests (S3 REST API fix)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.endsWith('/')) request.uri += 'index.html';
          else if (!request.uri.includes('.')) request.uri += '/index.html';
          return request;
        }
      Tags:
        - Key: awsApplication
          Value: arn:aws:resource-groups:sa-east-1:527540700211:group/lbenicio-community/06owkw4s6gp5r894wctvv2jj5u
        - Key: Project
          Value: blog

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: blog-security-headers
        Comment: Security headers for blog
        SecurityHeadersConfig:
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          XSSProtection:
            Override: true
            Protection: true
            ModeBlock: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' https://analytics.4686189.xyz 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://analytics.4686189.xyz; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formbold.com https://mail.4686189.xyz; upgrade-insecure-requests"
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
              Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        DefaultRootObject: !Ref DefaultRootObject
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        Aliases: !If
          - HasAlternativeDomains
          - !Split [";", !Sub "${DomainName};${AlternativeDomains}"]
          - - !Ref DomainName
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: s3-origin
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          ForwardedValues:
            QueryString: false
            Headers: [Origin]
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CacheBehaviors:
          - PathPattern: assets/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 31536000
            MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 400
            ResponseCode: 400
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 405
            ResponseCode: 405
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 414
            ResponseCode: 414
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 416
            ResponseCode: 416
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ResponseCode: 500
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 501
            ResponseCode: 501
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ResponseCode: 502
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ResponseCode: 503
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ResponseCode: 504
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          AcmCertificateArn: !If [CreateCertificate, !Ref SiteCertificate, !Ref CertificateArn]
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.3_2025
      Tags:
        - { Key: app, Value: lbenicio-community }
        - Key: awsApplication
          Value: arn:aws:resource-groups:sa-east-1:527540700211:group/lbenicio-community/06owkw4s6gp5r894wctvv2jj5u
        - Key: Project
          Value: blog

Outputs:
  S3BucketName:
    Description: S3 bucket name.
    Value: !Ref SiteBucket
  CloudFrontDomainName:
    Description: CloudFront domain ? point Cloudflare CNAME here.
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref CloudFrontDistribution
  CertificateArn:
    Description: ACM certificate ARN.
    Value: !If [CreateCertificate, !Ref SiteCertificate, !Ref CertificateArn]
  GitHubDeployRoleArn:
    Description: GitHub OIDC role for deploying the blog site.
    Value: !GetAtt GitHubDeployRole.Arn
